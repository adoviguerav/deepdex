name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package DMGs (Apple Silicon and Intel)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify ad-hoc signatures
        run: |
          for app in dist/mac*/DeepDex.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: DeepDex-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            Descarga `DeepDex-…-arm64.dmg` si tu Mac tiene chip Apple (M1, M2, M3, M4) o `DeepDex-…-x64.dmg` si es Intel.
            La primera vez macOS avisará de que no puede verificar al desarrollador: ver «Instalar» en el README.
